name: Package checks
on: [push, pull_request]
jobs:
  architecture:
    uses: full-aigc-plugins/.github/.github/workflows/partme-plugin-architecture.yml@main
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -B scripts/validate_package.py
      - run: python3 -B skills/easyeda-format-skill/scripts/validate_format.py --install-deps --runtime-dir .local/format-runtime
      - run: python3 -B -m unittest discover -s tests -v
        env:
          EASYEDA_FORMAT_RUNTIME: ${{ github.workspace }}/.local/format-runtime
      - run: node skills/easyeda-eprj3/upstream/test/smoke.js
